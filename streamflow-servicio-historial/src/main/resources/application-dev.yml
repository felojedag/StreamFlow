server:
  port: 8085

spring:
  application:
    name: servicio-historial

  datasource:
    url: jdbc:h2:mem:historial_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true