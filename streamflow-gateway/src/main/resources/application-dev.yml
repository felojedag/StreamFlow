server:
  port: 8080

spring:
  application:
    name: streamflow-gateway
  cloud:
    gateway:
      routes:
        - id: servicio-usuarios
          uri: http://localhost:8081
          predicates:
            - Path=/api/usuarios/**

        - id: servicio-auth
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**

        - id: servicio-catalogo
          uri: http://localhost:8083
          predicates:
            - Path=/api/catalogo/**

        - id: servicio-favoritos
          uri: http://localhost:8084
          predicates:
            - Path=/api/favoritos/**

        - id: servicio-historial
          uri: http://localhost:8085
          predicates:
            - Path=/api/historial/**

        - id: servicio-notificaciones
          uri: http://localhost:8086
          predicates:
            - Path=/api/notificaciones/**

        - id: servicio-pagos
          uri: http://localhost:8087
          predicates:
            - Path=/api/pagos/**

        - id: servicio-reviews
          uri: http://localhost:8088
          predicates:
            - Path=/api/reviews/**

        - id: servicio-suscripciones
          uri: http://localhost:8089
          predicates:
            - Path=/api/suscripciones/**