server:
  port: ${PORT:8080}

spring:
  cloud:
    gateway:
      routes:
        - id: servicio-usuarios
          uri: ${URL_USUARIOS:http://localhost:8081}
          predicates:
            - Path=/api/usuarios/**

        - id: servicio-suscripciones
          uri: ${URL_SUSCRIPCIONES:http://localhost:8082}
          predicates:
            - Path=/api/suscripciones/**